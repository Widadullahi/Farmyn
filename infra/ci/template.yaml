AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GitHub Actions deploy access for Farmyn. GitHub assumes FarmynGitHubDeploy via
  OIDC (no stored AWS keys), only from the main branch. That role can drive the
  farmyn and farmyn-web stacks; the broad permissions live in the CloudFormation
  execution role, which GitHub can pass to CloudFormation but not use directly.
  Deploy by hand: aws cloudformation deploy --stack-name farmyn-ci
  --template-file infra/ci/template.yaml --capabilities CAPABILITY_NAMED_IAM
Parameters:
  Repository:
    Type: String
    # The repo uses GitHub's immutable OIDC subjects (owner@id/repo@id), so the
    # token's sub is repo:Widadullahi@156221762/Farmyn@1175957672:ref:refs/heads/main.
    # Check with: gh api repos/Widadullahi/Farmyn/actions/oidc/customization/sub
    Default: Widadullahi@156221762/Farmyn@1175957672
  Branch:
    Type: String
    Default: main
  SamBucket:
    Type: String
    Description: SAM CLI managed artifact bucket (aws-sam-cli-managed-default stack).
  WebAssetsBucket:
    Type: String
    Description: farmyn-web AssetsBucket output.
  WebDistributionId:
    Type: String
    Description: farmyn-web DistributionId output.
Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  CloudFormationExecution:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FarmynCloudFormationExecution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]

  GitHubDeploy:
    Type: AWS::IAM::Role
    Properties:
      RoleName: FarmynGitHubDeploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${Repository}:ref:refs/heads/${Branch}'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/farmyn/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/farmyn-web/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: TemplateChecks
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary]
                Resource: '*'
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecution.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:DeleteObject, s3:GetBucketLocation]
                Resource:
                  - !Sub 'arn:aws:s3:::${SamBucket}'
                  - !Sub 'arn:aws:s3:::${SamBucket}/*'
                  - !Sub 'arn:aws:s3:::${WebAssetsBucket}'
                  - !Sub 'arn:aws:s3:::${WebAssetsBucket}/*'
              - Sid: Invalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistributionId}'
Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeploy.Arn
  ExecutionRoleArn:
    Value: !GetAtt CloudFormationExecution.Arn
