AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Farmyn AWS backend, secure accounts and private product photos. No seed data.
Parameters:
  WebOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
    Description: Exact HTTPS frontend origin, without a trailing slash.
  AlertEmail:
    Type: String
    Description: Operations email that will confirm the SNS alert subscription.
  AdminEmail:
    Type: String
    Default: alagbewidad814@gmail.com
    Description: Email allowed to sign in to the Farmyn super-admin console.
  CognitoFromEmail:
    Type: String
    Default: ''
    Description: Optional SES-verified sender email, such as no-reply@farmyn.ng.
  CognitoEmailSourceArn:
    Type: String
    Default: ''
    Description: Optional ARN of the verified SES email identity or domain.
Conditions:
  UseCustomCognitoEmail: !And
    - !Not [!Equals [!Ref CognitoFromEmail, '']]
    - !Not [!Equals [!Ref CognitoEmailSourceArn, '']]
Resources:
  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  Photos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref WebOrigin
            AllowedMethods: [PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  PhotosPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Photos
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Photos.Arn, !Sub '${Photos.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  Accounts:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Farmyn verification code
        EmailMessage: !Sub |
          <!doctype html>
          <html lang="en">
            <body style="margin:0;padding:0;background:#f4f7f2;font-family:Arial,sans-serif;color:#17382d;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7f2;padding:32px 12px;">
                <tr>
                  <td align="center">
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #dce7db;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px rgba(23,56,45,.10);">
                      <tr>
                        <td style="background:#165c3a;padding:30px 36px;text-align:center;">
                          <img src="${WebOrigin}/farmyn-pwa-192.png" width="64" height="64" alt="Farmyn" style="display:block;margin:0 auto 12px;border-radius:16px;background:#ffffff;" />
                          <div style="font-size:30px;line-height:1;font-weight:800;color:#ffffff;">Farm<span style="color:#9bd36b;">yn</span></div>
                          <div style="margin-top:8px;font-size:11px;letter-spacing:2px;font-weight:700;color:#d7ead8;">FRESH FROM THE FARM</div>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:38px 36px 18px;text-align:center;">
                          <div style="display:inline-block;padding:7px 12px;border-radius:999px;background:#eef7e9;color:#3f7e2a;font-size:11px;font-weight:800;letter-spacing:1.4px;">EMAIL VERIFICATION</div>
                          <h1 style="margin:20px 0 10px;font-size:28px;line-height:1.25;color:#17382d;">Welcome to Farmyn</h1>
                          <p style="margin:0 auto;max-width:460px;font-size:15px;line-height:1.7;color:#5d7169;">Use the verification code below to confirm your email and finish setting up your Farmyn account.</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:10px 36px 24px;text-align:center;">
                          <div style="margin:0 auto;max-width:360px;border:2px dashed #e0a33c;border-radius:18px;background:#fff8e9;padding:24px 16px;">
                            <div style="font-size:11px;font-weight:800;letter-spacing:1.6px;color:#9b681d;">YOUR VERIFICATION CODE</div>
                            <div style="margin-top:10px;font-family:Courier New,monospace;font-size:38px;line-height:1;font-weight:800;letter-spacing:9px;color:#165c3a;">{####}</div>
                          </div>
                          <p style="margin:16px 0 0;font-size:12px;line-height:1.6;color:#7b8b84;">For your security, do not share this code with anyone.</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:0 36px 34px;text-align:center;">
                          <a href="${WebOrigin}/register" style="display:inline-block;background:#e6a43a;color:#17382d;text-decoration:none;font-size:14px;font-weight:800;padding:14px 24px;border-radius:12px;">Enter code on Farmyn</a>
                          <p style="margin:22px auto 0;max-width:470px;font-size:13px;line-height:1.7;color:#6d7e77;">If you did not create a Farmyn account, you can safely ignore this message. Farmyn will never ask you to send this code by chat or phone.</p>
                        </td>
                      </tr>
                      <tr>
                        <td style="background:#eef4ed;padding:20px 30px;text-align:center;font-size:11px;line-height:1.6;color:#718078;">Farmyn Nigeria · Buy and sell farm products directly<br />This is an automated account-security message.</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
          </html>
      EmailConfiguration: !If
        - UseCustomCognitoEmail
        - EmailSendingAccount: DEVELOPER
          From: !Sub 'Farmyn <${CognitoFromEmail}>'
          SourceArn: !Ref CognitoEmailSourceArn
        - EmailSendingAccount: COGNITO_DEFAULT
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints:
            MinLength: '5'
            MaxLength: '6'
        - Name: location
          AttributeDataType: String
          Mutable: true
        - Name: storeName
          AttributeDataType: String
          Mutable: true
  AccountClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Accounts
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
      ReadAttributes: [email, email_verified, name, phone_number, 'custom:role', 'custom:location', 'custom:storeName']
      WriteAttributes: [email, name, phone_number, 'custom:role', 'custom:location', 'custom:storeName']
  # Holds ADMIN_PASSWORD_HASH (scrypt salt:hash). Created with a random value that
  # is not a valid hash, so admin sign-in fails closed until an operator sets it:
  # aws secretsmanager put-secret-value --secret-id farmyn/admin
  #   --secret-string '{"ADMIN_PASSWORD_HASH":"<salt>:<hash>"}'
  # Later deploys never overwrite the stored value.
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/admin'
      Description: Farmyn super-admin password hash (scrypt salt:hash).
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: ADMIN_PASSWORD_HASH
        PasswordLength: 32
        ExcludePunctuation: true
  # CloudFront sends this as x-farmyn-edge so the API can trust its
  # x-farmyn-viewer-ip header for rate limiting (see infra/web/template.yaml).
  EdgeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/edge'
      Description: Shared secret CloudFront sends to the Farmyn API to vouch for x-farmyn-viewer-ip.
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: EDGE_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
  Api:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../apps/backend/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 29
      # No ReservedConcurrentExecutions: new accounts start with a 10-execution
      # limit and Lambda refuses reservations that leave fewer than 10 unreserved.
      # HttpApi throttling (20 rps, burst 40) bounds traffic instead.
      Environment:
        Variables:
          NODE_ENV: production
          PUBLIC_WEB_URL: !Ref WebOrigin
          DYNAMODB_TABLE: !Ref Data
          COGNITO_CLIENT_ID: !Ref AccountClient
          PRODUCT_PHOTOS_BUCKET: !Ref Photos
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_SECRET_ARN: !Ref AdminSecret
          EDGE_SECRET_ARN: !Ref EdgeSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:TransactWriteItems]
              Resource: !GetAtt Data.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
              Resource: !Sub '${Photos.Arn}/products/*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: [!Ref EdgeSecret, !Ref AdminSecret]
      Events:
        All:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Api}'
      RetentionInDays: 30
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  ApiFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '"api_failure"'
      MetricTransformations:
        - MetricNamespace: Farmyn
          MetricName: ApiFailure
          MetricValue: '1'
          DefaultValue: 0
  ApiFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Farmyn
      MetricName: ApiFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
Outputs:
  ApiOrigin:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CognitoClientId:
    Value: !Ref AccountClient
  UserPoolId:
    Value: !Ref Accounts
  DataTable:
    Value: !Ref Data
  PhotoBucket:
    Value: !Ref Photos
  EdgeSecretName:
    Value: !Sub '${AWS::StackName}/edge'
