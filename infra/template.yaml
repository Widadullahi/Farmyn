AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Farmyn AWS backend, secure accounts and private product photos. No seed data.
Parameters:
  WebOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
    Description: Exact HTTPS frontend origin, without a trailing slash.
  PaystackSecretArn:
    Type: String
    Description: ARN of a Secrets Manager JSON secret containing PAYSTACK_SECRET_KEY (test key for acceptance).
  AlertEmail:
    Type: String
    Description: Operations email that will confirm the SNS alert subscription.
Resources:
  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
  Photos:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: RemoveIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  PhotosPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Photos
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Photos.Arn, !Sub '${Photos.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  Accounts:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: false
          StringAttributeConstraints:
            MinLength: '5'
            MaxLength: '6'
        - Name: location
          AttributeDataType: String
          Mutable: true
        - Name: storeName
          AttributeDataType: String
          Mutable: true
  AccountClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Accounts
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
      ReadAttributes: [email, email_verified, name, phone_number, 'custom:role', 'custom:location', 'custom:storeName']
      WriteAttributes: [email, name, phone_number, 'custom:role', 'custom:location', 'custom:storeName']
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
  Api:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../apps/backend/
      Handler: lambda.handler
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 29
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          NODE_ENV: production
          PUBLIC_WEB_URL: !Ref WebOrigin
          DYNAMODB_TABLE: !Ref Data
          COGNITO_CLIENT_ID: !Ref AccountClient
          PRODUCT_PHOTOS_BUCKET: !Ref Photos
          PAYSTACK_SECRET_ARN: !Ref PaystackSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:TransactWriteItems]
              Resource: !GetAtt Data.Arn
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub '${Photos.Arn}/products/*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref PaystackSecretArn
      Events:
        All:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Api}'
      RetentionInDays: 30
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email
  PaymentReviewMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '"payment_review_required"'
      MetricTransformations:
        - MetricNamespace: Farmyn
          MetricName: PaymentReview
          MetricValue: '1'
          DefaultValue: 0
  PaymentReviewAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Farmyn
      MetricName: PaymentReview
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Api
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
  ApiFailureMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '"api_failure"'
      MetricTransformations:
        - MetricNamespace: Farmyn
          MetricName: ApiFailure
          MetricValue: '1'
          DefaultValue: 0
  ApiFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: Farmyn
      MetricName: ApiFailure
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alerts]
Outputs:
  ApiOrigin:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  CognitoClientId:
    Value: !Ref AccountClient
  UserPoolId:
    Value: !Ref Accounts
  DataTable:
    Value: !Ref Data
  PhotoBucket:
    Value: !Ref Photos
